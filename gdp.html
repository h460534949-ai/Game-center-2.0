<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare the GDP - Game Zone</title>
    <link rel="stylesheet" href="stylesheet.css">
    <style>
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .score-box {
            background: #1a1a2e;
            border: 2px solid #2a2a4a;
            border-radius: 8px;
            padding: 8px 18px;
            text-align: center;
            min-width: 80px;
        }

        .score-box .label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-box .value {
            font-size: 22px;
            font-weight: 700;
            color: #00d4ff;
        }

        .score-box .value.coins {
            color: #ffd700;
        }

        .compare-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 24px;
            width: 100%;
            max-width: 640px;
        }

        .country-card {
            background: #1a1a2e;
            border: 2px solid #2a2a4a;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            flex: 1;
            max-width: 260px;
            transition: border-color 0.3s;
        }

        .country-card.winner {
            border-color: #2ecc71;
        }

        .country-card.loser {
            border-color: #e74c3c;
        }

        .country-card img {
            width: 160px;
            height: 107px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid #2a2a4a;
            background: #0f0f1a;
            margin-bottom: 10px;
        }

        .country-card .country-name {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .country-card .gdp-value {
            font-size: 14px;
            color: #ffd700;
            font-weight: 600;
            min-height: 20px;
        }

        .vs-badge {
            font-size: 28px;
            font-weight: 900;
            color: #00d4ff;
            text-shadow: 0 0 12px rgba(0, 212, 255, 0.4);
            flex-shrink: 0;
        }

        .answer-btns {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .answer-btn {
            padding: 14px 32px;
            background: #1a1a2e;
            border: 2px solid #2a2a4a;
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 180px;
        }

        .answer-btn:hover:not(:disabled) {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.08);
        }

        .answer-btn:disabled {
            cursor: default;
        }

        .answer-btn.correct {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
        }

        .answer-btn.wrong {
            border-color: #e74c3c;
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
        }

        .feedback {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            min-height: 28px;
            margin-bottom: 8px;
        }

        .feedback.correct {
            color: #2ecc71;
        }

        .feedback.wrong {
            color: #e74c3c;
        }

        .streak-display {
            text-align: center;
            color: #ffd700;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
            margin-bottom: 16px;
        }

        .controls-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .round-label {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 12px;
        }

        @media (max-width: 768px) {
            .compare-area {
                flex-direction: column;
                gap: 12px;
            }

            .country-card {
                max-width: 100%;
            }

            .country-card img {
                width: 200px;
                height: 133px;
            }

            .vs-badge {
                font-size: 22px;
            }

            .answer-btns {
                flex-direction: column;
                align-items: center;
            }

            .answer-btn {
                min-width: 240px;
            }

            .score-bar {
                gap: 8px;
            }

            .score-box {
                padding: 6px 12px;
                min-width: 60px;
            }

            .score-box .value {
                font-size: 18px;
            }
        }
    </style>
</head>

            </div>

            </div>

                <div class="value coins" id="coinsDisplay">0</div>
            </div>
        </div>

        <div class="round-label" id="roundLabel">Press Start to play!</div>

        <div class="compare-area" id="compareArea" style="display:none;">
            <div class="country-card" id="cardA">
                <img id="flagA" src="" alt="Country A flag">
                <div class="country-name" id="nameA"></div>

            <div class="vs-badge">VS</div>

                <div class="gdp-value" id="gdpB"></div>

        </div>

        <div class="answer-btns" id="answerBtns">

            <button class="answer-btn" id="btnB" disabled>Country B</button>
        </div>

        <div class="feedback" id="feedback"></div>
        <div class="streak-display" id="streakInfo"></div>

        <div class="controls-bar">
            <div style="display: flex; gap: 8px; align-items: center;">
                <label for="roundSelect" style="color: #888; font-size: 14px;">Rounds:</label>
                <select id="roundSelect"
                    style="background: #1a1a2e; color: #00d4ff; border: 2px solid #2a2a4a; border-radius: 6px; padding: 8px 12px; font-size: 14px; cursor: pointer;">
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="50">50</option>
                </select>
            </div>
            <button class="game-btn" id="startBtn">Start Game</button>
        </div>
    </div>

    <div class="overlay" id="gameOverOverlay">
        <div class="overlay-content">

                <a href="shop.html" class="game-btn"
                    style="text-decoration:none; background: #ffd700; color: #0f0f1a;">Shop</a>
            </div>
        </div>
    </div>

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

            if (value >= 1000000) {

            return '$' + (value / 1000).toFixed(0) + ' billion';

            btnB.disabled = false;
            btnA.className = 'answer-btn';
            btnB.className = 'answer-btn';

            const pair = shuffle(COUNTRIES).slice(0, 2);
            countryA = pair[0];
            countryB = pair[1];

            flagA.src = 'https://flagcdn.com/w320/' + countryA.code + '.png';
            flagA.alt = countryA.name + ' flag';
            flagB.src = 'https://flagcdn.com/w320/' + countryB.code + '.png';
            flagB.alt = countryB.name + ' flag';
            nameA.textContent = countryA.name;
            nameB.textContent = countryB.name;

            flagA.onerror = function () {
                this.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="107"><rect fill="%23333" width="160" height="107"/><text fill="%23999" font-size="12" x="50%" y="50%" text-anchor="middle" dy=".3em">Flag N/A</text></svg>';
            };
            flagB.onerror = function () {
                this.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="107"><rect fill="%23333" width="160" height="107"/><text fill="%23999" font-size="12" x="50%" y="50%" text-anchor="middle" dy=".3em">Flag N/A</text></svg>';
            };

            compareArea.style.display = 'flex';
            btnA.textContent = countryA.name;
            btnB.textContent = countryB.name;
        }

        function handleAnswer(choice) {
            if (answered) return;
            answered = true;

            btnA.disabled = true;
            btnB.disabled = true;

            const higher = countryA.gdp >= countryB.gdp ? 'A' : 'B';
            const isCorrect = choice === higher;

            gdpA.textContent = formatGDP(countryA.gdp);
            gdpB.textContent = formatGDP(countryB.gdp);

            if (higher === 'A') {
                cardA.classList.add('winner');
                cardB.classList.add('loser');
            } else {
                cardB.classList.add('winner');
                cardA.classList.add('loser');
            }

            if (isCorrect) {
                score++;
                streak++;
                if (streak > bestStreak) bestStreak = streak;
                scoreDisplay.textContent = score;
                streakDisplay.textContent = streak;
                (choice === 'A' ? btnA : btnB).classList.add('correct');
                feedback.textContent = 'Correct!';
                feedback.className = 'feedback correct';
                if (streak >= 3) {
                    streakInfo.textContent = streak + ' in a row!';
                } else {
                    streakInfo.textContent = '';
                }
            } else {
                streak = 0;
                streakDisplay.textContent = '0';
                (choice === 'A' ? btnA : btnB).classList.add('wrong');
                const winnerName = higher === 'A' ? countryA.name : countryB.name;
                feedback.textContent = 'Wrong! ' + winnerName + ' has the higher GDP.';
                feedback.className = 'feedback wrong';
                streakInfo.textContent = '';
            }

            setTimeout(nextRound, 2500);
        }

        function endGame() {
            coinsEarned = score * COINS_PER_CORRECT;
            addCoins(coinsEarned);

            compareArea.style.display = 'none';
            roundLabel.textContent = 'Game Over!';
            btnA.disabled = true;
            btnB.disabled = true;
            feedback.textContent = '';
            streakInfo.textContent = '';

            document.getElementById('endTitle').textContent =
                score === TOTAL_ROUNDS ? 'Perfect Score!' :
                    score >= Math.floor(TOTAL_ROUNDS * 0.7) ? 'Great Job!' :
                        score >= Math.floor(TOTAL_ROUNDS * 0.4) ? 'Not Bad!' : 'Keep Learning!';
            document.getElementById('endMsg').textContent =
                'You scored ' + score + ' out of ' + TOTAL_ROUNDS +
                (bestStreak >= 3 ? ' (Best streak: ' + bestStreak + ')' : '');
            document.getElementById('endCoins').textContent =
                coinsEarned > 0 ? '+' + coinsEarned + ' \uD83E\uDE99' : 'No coins earned';

            overlay.classList.add('active');
        }

        btnA.addEventListener('click', () => handleAnswer('A'));
        btnB.addEventListener('click', () => handleAnswer('B'));
        startBtn.addEventListener('click', startGame);
        playAgainBtn.addEventListener('click', startGame);
    </script>
</body>

</html>
