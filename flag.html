<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Guess - Game Zone</title>
    <link rel="stylesheet" href="stylesheet.css">
    <style>
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .score-box {
            background: #1a1a2e;
            border: 2px solid #2a2a4a;
            border-radius: 8px;
            padding: 8px 18px;
            text-align: center;
            min-width: 80px;
        }

        .score-box .label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-box .value {
            font-size: 22px;
            font-weight: 700;
            color: #00d4ff;
        }

        .score-box .value.coins {
            color: #ffd700;
        }

        .flag-card {
            background: #1a1a2e;
            border: 2px solid #2a2a4a;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            text-align: center;
            min-width: 320px;
        }

        .flag-card img {
            width: 240px;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #2a2a4a;
            background: #0f0f1a;
        }

        .flag-card .round-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            max-width: 480px;
            width: 100%;
        }

        .choice-btn {
            padding: 14px 16px;
            background: #1a1a2e;
            border: 2px solid #2a2a4a;
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .choice-btn:hover:not(:disabled) {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.08);
        }

        .choice-btn:disabled {
            cursor: default;
        }

        .choice-btn.correct {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
        }

        .choice-btn.wrong {
            border-color: #e74c3c;
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
        }

        .feedback {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            min-height: 28px;
            margin-top: 16px;
        }

        .feedback.correct {
            color: #2ecc71;
        }

        .feedback.wrong {
            color: #e74c3c;
        }

        .streak-display {
            text-align: center;
            color: #ffd700;
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
            min-height: 20px;
        }

        .controls-bar {
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .flag-card {
                min-width: auto;
                width: 100%;
                padding: 16px;
            }

            .flag-card img {
                width: 180px;
                height: 120px;
            }

            .choices {
                grid-template-columns: 1fr;
            }

            .score-bar {
                gap: 8px;
            }

            .score-box {
                padding: 6px 12px;
                min-width: 60px;
            }

            .score-box .value {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-link">&#8592; Back to Games</a>

    <div class="game-header">
        <h1>&#127987; Flag Guess</h1>
        <p>Can you identify the country from its flag?</p>
    </div>

    <div class="game-wrapper">
        <div class="score-bar">
            <div class="score-box">

                <div class="value" id="roundDisplay">0/10</div>
            </div>
            <div class="score-box">
                <div class="label">Score</div>
                <div class="value" id="scoreDisplay">0</div>
            </div>
            <div class="score-box">
                <div class="label">Streak</div>
                <div class="value" id="streakDisplay">0</div>
            </div>
            <div class="score-box">
                <div class="label">Coins</div>
                <div class="value coins" id="coinsDisplay">0</div>
            </div>
        </div>

        <div class="flag-card">
            <div class="round-label" id="roundLabel">Press Start to play!</div>
            <img id="flagImg" src="" alt="Country Flag" style="display:none;">
        </div>

        <div class="choices" id="choicesContainer"></div>

        <div class="feedback" id="feedback"></div>
        <div class="streak-display" id="streakInfo"></div>

        <div class="controls-bar" style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
            <div style="display: flex; gap: 8px; align-items: center;">
                <label for="roundSelect" style="color: #888; font-size: 14px;">Rounds:</label>
                <select id="roundSelect" style="background: #1a1a2e; color: #00d4ff; border: 2px solid #2a2a4a; border-radius: 6px; padding: 8px 12px; font-size: 14px; cursor: pointer;">
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="50">50</option>
                </select>
            </div>
            <button class="game-btn" id="startBtn">Start Game</button>
        </div>
    </div>

    <div class="overlay" id="gameOverOverlay">
        <div class="overlay-content">
            <h2 id="endTitle">Game Over!</h2>
            <p id="endMsg">You scored 0 out of 10</p>
            <p id="endCoins" style="color: #ffd700; font-size: 18px; font-weight: 700;"></p>
            <div style="display: flex; gap: 12px; justify-content: center; margin-top: 16px; flex-wrap: wrap;">
                <button class="game-btn" id="playAgainBtn">Play Again</button>
                <a href="shop.html" class="game-btn"
                    style="text-decoration:none; background: #ffd700; color: #0f0f1a;">Shop</a>
            </div>
        </div>
    </div>

        let currentRound = 0;
        let score = 0;
        let streak = 0;
        let bestStreak = 0;
        let coinsEarned = 0;
        let correctAnswer = null;
        let answered = false;
        let roundCountries = [];

        const roundDisplay = document.getElementById('roundDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const streakDisplay = document.getElementById('streakDisplay');
        const coinsDisplay = document.getElementById('coinsDisplay');
        const roundLabel = document.getElementById('roundLabel');
        const flagImg = document.getElementById('flagImg');
        const choicesContainer = document.getElementById('choicesContainer');
        const feedback = document.getElementById('feedback');
        const streakInfo = document.getElementById('streakInfo');
        const startBtn = document.getElementById('startBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const overlay = document.getElementById('gameOverOverlay');

        function getCoins() { return parseInt(localStorage.getItem(COINS_KEY) || '0'); }
        function addCoins(amount) {
            localStorage.setItem(COINS_KEY, (getCoins() + amount).toString());
            coinsDisplay.textContent = getCoins();
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function pickRandom(arr, n) {
            return shuffle(arr).slice(0, n);
        }

        coinsDisplay.textContent = getCoins();

        const roundSelect = document.getElementById('roundSelect');

        function startGame() {
            TOTAL_ROUNDS = parseInt(roundSelect.value);
            currentRound = 0;
            score = 0;
            streak = 0;
            bestStreak = 0;
            coinsEarned = 0;
            scoreDisplay.textContent = '0';
            streakDisplay.textContent = '0';
            feedback.textContent = '';
            feedback.className = 'feedback';
            streakInfo.textContent = '';
            overlay.classList.remove('active');
            startBtn.textContent = 'New Game';
            nextRound();
        }

        function nextRound() {
            if (currentRound >= TOTAL_ROUNDS) {
                endGame();
                return;
            }

            currentRound++;
            answered = false;
            roundDisplay.textContent = currentRound + '/' + TOTAL_ROUNDS;
            roundLabel.textContent = 'Which country does this flag belong to?';
            feedback.textContent = '';
            feedback.className = 'feedback';

            const choices = pickRandom(COUNTRIES, 4);
            correctAnswer = choices[Math.floor(Math.random() * choices.length)];

            flagImg.src = 'https://flagcdn.com/w320/' + correctAnswer.code + '.png';
            flagImg.alt = 'Country flag';
            flagImg.style.display = 'block';
            flagImg.onerror = function () {
                this.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160"><rect fill="%23333" width="240" height="160"/><text fill="%23999" font-size="16" x="50%" y="50%" text-anchor="middle" dy=".3em">Flag unavailable</text></svg>';
            };

            choicesContainer.innerHTML = '';
            choices.forEach(country => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = country.name;
                btn.dataset.code = country.code;
                btn.addEventListener('click', () => handleAnswer(btn, country));
                choicesContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedBtn, country) {
            if (answered) return;
            answered = true;

            const buttons = choicesContainer.querySelectorAll('.choice-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.dataset.code === correctAnswer.code) {
                    btn.classList.add('correct');
                }
            });

            if (country.code === correctAnswer.code) {
                score++;
                streak++;
                if (streak > bestStreak) bestStreak = streak;
                scoreDisplay.textContent = score;
                streakDisplay.textContent = streak;
                feedback.textContent = 'Correct!';
                feedback.className = 'feedback correct';
                if (streak >= 3) {
                    streakInfo.textContent = streak + ' in a row!';
                } else {
                    streakInfo.textContent = '';
                }
            } else {
                selectedBtn.classList.add('wrong');
                streak = 0;
                streakDisplay.textContent = '0';
                feedback.textContent = 'Wrong! It was ' + correctAnswer.name;
                feedback.className = 'feedback wrong';
                streakInfo.textContent = '';
            }

            setTimeout(nextRound, 1500);
        }

        function endGame() {
            coinsEarned = score * COINS_PER_CORRECT;
            addCoins(coinsEarned);

            flagImg.style.display = 'none';
            roundLabel.textContent = 'Game Over!';
            choicesContainer.innerHTML = '';
            feedback.textContent = '';
            streakInfo.textContent = '';

            document.getElementById('endTitle').textContent =
                score === TOTAL_ROUNDS ? 'Perfect Score!' :
                    score >= 7 ? 'Great Job!' :
                        score >= 4 ? 'Not Bad!' : 'Keep Practicing!';
            document.getElementById('endMsg').textContent =
                'You scored ' + score + ' out of ' + TOTAL_ROUNDS +
                (bestStreak >= 3 ? ' (Best streak: ' + bestStreak + ')' : '');
            document.getElementById('endCoins').textContent =
                coinsEarned > 0 ? '+' + coinsEarned + ' \uD83E\uDE99' : 'No coins earned';

            overlay.classList.add('active');
        }

        startBtn.addEventListener('click', startGame);
        playAgainBtn.addEventListener('click', startGame);
